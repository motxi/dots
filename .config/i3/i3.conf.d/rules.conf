# Float everything by default, then opt out below (order matters)
for_window [class=".*"] floating enable, move position center

for_window [class="kitty"] floating disable
for_window [class="firefox"] floating disable
for_window [class="vesktop"] floating disable
for_window [class="spotifast"] floating disable

for_window [class="steam" title="Steam"] floating disable
for_window [class="steam" title="Steam Settings"] floating enable
for_window [class="^steam_app_\d+$"] fullscreen enable

for_window [class="pavucontrol"] sticky enable
for_window [class="vesktop" title="^(?!.*(Discord|Vesktop)).*$"] sticky enable

# Workspace assignments
assign [class="spotifast"] 9
assign [class="vesktop"] 9
