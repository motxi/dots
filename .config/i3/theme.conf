set $background #141414
set $background_alternate #1c1c1c
set $surface #262626
set $inactive #303030
set $focus #3d3d3d
set $dim #5e5e5e
set $foreground_dim #8c8c8c
set $foreground #d0d0d0

default_border normal 1
default_floating_border normal 1
hide_edge_borders smart

client.focused $focus $focus $foreground $dim $focus
client.focused_inactive $surface $surface $foreground_dim $surface $surface
client.unfocused $background_alternate $background_alternate $dim $background_alternate $background_alternate
client.urgent $foreground_dim $foreground_dim $background $foreground_dim $foreground_dim
client.placeholder $background_alternate $background_alternate $dim $background_alternate $background_alternate
client.background $background

bar {
    status_command i3status | ~/.scripts/media-status.sh
    position bottom
    separator_symbol " | "

    colors {
        background $background
        statusline $foreground_dim
        separator $inactive

        focused_workspace $focus $focus $foreground
        active_workspace $surface $surface $foreground_dim
        inactive_workspace $background $background $dim
        urgent_workspace $foreground_dim $foreground_dim $background
        binding_mode $foreground_dim $foreground_dim $background
    }
}

gaps inner 4
gaps outer 0

smart_gaps on
