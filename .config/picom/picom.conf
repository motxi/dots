backend = "glx";

vsync = true;
use-damage = true;
log-level = "warn";

detect-rounded-corners = true;

fading = false;

shadow = true;

shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'combo'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",

    "class_g = 'firefox' && argb",
    "_GTK_FRAME_EXTENTS@",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

animations = (
    {
        triggers = ["open", "show"];
        preset = "appear";
        scale = 0.95;
        duration = 0.15;
    },
    {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 0.95;
        duration = 0.15;
    }
);

wintypes:
{
    dock = { shadow = false; };
    dnd = { shadow = false; };
};
