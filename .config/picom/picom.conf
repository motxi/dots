backend = "glx";

vsync = true;
use-damage = true;
log-level = "warn";

detect-rounded-corners = true;

fading = false;

shadow = true;

shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

shadow-exclude = [
    "class_g = 'firefox' && argb",
    "class_g = 'steam'",
    "class_g = 'steamwebhelper'",
    "_GTK_FRAME_EXTENTS@",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

animations = (
    {
        triggers = ["open", "show"];
        preset = "appear";
        scale = 0.95;
        duration = 0.15;
    },
    {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 0.95;
        duration = 0.15;
    }
);

wintypes:
{
    combo = { shadow = false; };
    desktop = { shadow = false; };
    dnd = { shadow = false; };
    dock = { shadow = false; };
    dropdown_menu = { shadow = false; };
    menu = { shadow = false; };
    notification = { shadow = false; };
    popup_menu = { shadow = false; };
    splash = { shadow = false; };
    tooltip = { shadow = false; };
    utility = { shadow = false; };
};
