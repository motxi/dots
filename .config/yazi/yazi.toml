[mgr]

sort_by = "alphabetical"
sort_dir_first = true

show_hidden = true
show_symlink = true

linemode = "mtime"

[preview]

wrap = "yes"
tab_size = 4

[opener]

play = [
    { run = "mpv %s", orphan = true, for = "unix" },
]

edit = [
    { run = "$EDITOR %s", block = true, for = "unix" },
]

open = [
    { run = "xdg-open %s1", desc = "Open" },
]

[open]

rules = [
    { mime = "text/*", use = "edit" },
    { mime = "video/*", use = "play" },

    { url = "*.json", use = "edit" },
    { url = "*.sh", use = "edit" },
    { url = "*.html", use = [ "open", "edit" ] },
]
