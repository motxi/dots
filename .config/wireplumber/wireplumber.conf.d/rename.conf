monitor.alsa.rules = [
    {
        matches = [
            {
                device.name = "alsa_card.usb-Logitech_G733_Gaming_Headset_0000000000000000-00"
            }
        ]
        actions = {
            update-props = {
                device.nick = "Headset"
                device.description = "Headset"
            }
        }
    }
    {
        matches = [
            {
                device.name = "alsa_card.pci-0000_7c_00.6"
            }
        ]
        actions = {
            update-props = {
                device.nick = "Speakers"
                device.description = "Speakers"
            }
        }
    }
]
